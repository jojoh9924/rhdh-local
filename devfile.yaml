schemaVersion: 2.3.0
metadata:
  name: rhdh-plugin-dev
  version: 1.0.0
  displayName: RHDH Plugin Development
  description: >-
    Dev Spaces workspace for developing and testing dynamic plugins against a
    local RHDH instance. Fork this repo and customize the configuration section
    below to match your enterprise RHDH deployment.
attributes:
  controller.devfile.io/storage-type: per-workspace

# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║ ENTERPRISE CONFIGURATION                                                 ║
# ║                                                                          ║
# ║ Fork this repo and modify the values below to match your environment.    ║
# ║ See CUSTOMIZATION.md for detailed instructions.                          ║
# ╚═══════════════════════════════════════════════════════════════════════════╝

components:
  # ── Developer Tools Container ────────────────────────────────────────────
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      mountSources: true
      memoryLimit: 6Gi
      memoryRequest: 512Mi
      cpuLimit: "2"
      cpuRequest: 500m
      env:
        # ── Customize these for your environment ──
        - name: CLUSTER_APPS_DOMAIN
          value: "apps.example.com"            # CHANGEME: your OpenShift cluster apps domain
        - name: PLUGIN_NAME
          value: ""                            # Set per-workspace or leave empty for manual input
        - name: DYNAMIC_PLUGINS_ROOT
          value: /dynamic-plugins-root
        - name: NODE_OPTIONS
          value: "--max-old-space-size=3072"
        # ── Proxy (set only if behind corporate proxy) ──
        - name: PROXY_HOST
          value: ""
        - name: PROXY_PORT
          value: ""
      endpoints:
        - name: plugin-dev
          exposure: public
          targetPort: 3000
          protocol: https
          attributes:
            discoverable: true
            urlRewriteSupported: false
      volumeMounts:
        - name: dynamic-plugins-root
          path: /dynamic-plugins-root
        - name: yarn-cache
          path: /home/user/.cache/yarn

  # ── RHDH Container ──────────────────────────────────────────────────────
  - name: rhdh
    container:
      # CHANGEME: pin to the RHDH version your enterprise runs in production
      image: quay.io/rhdh-community/rhdh:1.10
      command: ["tail"]
      args: ["-f", "/dev/null"]
      mountSources: true
      memoryLimit: 6Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 500m
      env:
        - name: DEVSPACE_SCRIPTS_DIR
          value: /projects/rhdh-local
        - name: BASE_URL
          value: auto
        - name: RHDH_PUBLIC_ENDPOINT_NAME
          value: rhdh
        - name: CLUSTER_APPS_DOMAIN
          value: "apps.example.com"            # CHANGEME: must match tools container
        - name: NODE_ENV
          value: development
        - name: NODE_OPTIONS
          value: "--inspect=0.0.0.0:9229 --no-node-snapshot"
        # ── RHDH Plugin Configuration ──
        # CHANGEME: pin to the catalog index version matching your RHDH image
        - name: CATALOG_INDEX_IMAGE
          value: quay.io/rhdh/plugin-catalog-index:1.10
        - name: WAIT_FOR_PLUGINS_TIMEOUT
          value: "180"
        - name: CATALOG_ENTITIES_EXTRACT_DIR
          value: /opt/app-root/src/extensions
        - name: ENABLE_AUTH_PROVIDER_MODULE_OVERRIDE
          value: "true"
        - name: ENABLE_CORE_ROOTHTTPROUTER_OVERRIDE
          value: "true"
      endpoints:
        - name: rhdh
          exposure: public
          targetPort: 7007
          protocol: https
          attributes:
            discoverable: true
            urlRewriteSupported: false
        - name: node-debug
          exposure: internal
          targetPort: 9229
          protocol: tcp
      volumeMounts:
        - name: dynamic-plugins-root
          path: /opt/app-root/src/dynamic-plugins-root
        - name: dynamic-plugins-root
          path: /dynamic-plugins-root
        - name: extensions-catalog
          path: /opt/app-root/src/extensions
        - name: rhdh-generated
          path: /opt/app-root/src/generated

  # ── SonataFlow Container (optional — remove if not using orchestrator) ──
  - name: sonataflow
    container:
      # CHANGEME: pin to your enterprise's SonataFlow version
      image: registry.redhat.io/openshift-serverless-1/logic-swf-devmode-rhel9:1.37.2
      command: ["tail"]
      args: ["-f", "/dev/null"]
      mountSources: true
      memoryLimit: 4Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 500m
      env:
        - name: WORKFLOW_REPO_DIR
          value: /projects/rhdh-local
        - name: DEVSPACE_SCRIPTS_DIR
          value: /projects/rhdh-local
        - name: PROXY_HOST
          value: ""
        - name: PROXY_PORT
          value: ""
        - name: NON_PROXY_HOSTS
          value: ""
        - name: QUARKUS_HTTP_PORT
          value: "8899"
        - name: KOGITO_SERVICE_URL
          value: http://localhost:8899
        - name: KOGITO.CODEGEN.PROCESS.FAILONERROR
          value: "false"
        - name: MAX_YAML_CODE_POINTS
          value: "35000000"
        - name: MAX_ENTRY_SIZE
          value: "30000000"
        - name: MAVEN_ARGS_APPEND
          value: >-
            -s /home/kogito/.m2/settings.xml
            -DmaxYamlCodePoints=${MAX_YAML_CODE_POINTS}
            -T1C
            -Dmaven.artifact.threads=8
            -Djava.net.useSystemProxies=false
        - name: QUARKUS_EXTENSIONS
          value: >-
            io.quarkiverse.openapi.generator:quarkus-openapi-generator:2.12.0,
            org.kie:kie-addons-quarkus-monitoring-sonataflow,
            io.quarkus:quarkus-resteasy-client-oidc-filter,
            org.kie:kogito-addons-quarkus-jobs-knative-eventing
        - name: BACKSTAGE_NOTIFICATIONS_URL
          value: http://localhost:7007
        - name: QUARKUS_PROFILE
          value: "local-dev"
      endpoints:
        - name: sonataflow
          exposure: public
          targetPort: 8899
          protocol: https
          attributes:
            discoverable: true
            urlRewriteSupported: false
      volumeMounts:
        - name: sonataflow-m2-cache
          path: /home/kogito/.m2/repository
        - name: sonataflow-workflows
          path: /home/kogito/serverless-workflow-project/src/main/resources

  # ── Volumes ─────────────────────────────────────────────────────────────
  - name: dynamic-plugins-root
    volume:
      size: 2Gi
  - name: extensions-catalog
    volume:
      size: 1Gi
  - name: rhdh-generated
    volume:
      size: 512Mi
  - name: yarn-cache
    volume:
      size: 2Gi
  - name: sonataflow-m2-cache
    volume:
      size: 2Gi
  - name: sonataflow-workflows
    volume:
      size: 256Mi
  - name: projects
    volume:
      size: 20Gi

commands:
  # ── RHDH ────────────────────────────────────────────────────────────────
  - id: start-rhdh
    exec:
      label: "Start RHDH"
      component: rhdh
      commandLine: |
        chmod +x "/projects/rhdh-local/scripts/start-rhdh.sh" 2>/dev/null
        /projects/rhdh-local/scripts/start-rhdh.sh
      workingDir: /projects/rhdh-local
      group:
        kind: run
        isDefault: true
  - id: restart-rhdh
    exec:
      label: "Restart RHDH"
      component: rhdh
      commandLine: |
        echo "[rhdh] Stopping RHDH..."
        pkill -f 'node.*packages/backend' 2>/dev/null || true
        sleep 2
        pkill -9 -f 'node.*packages/backend' 2>/dev/null || true
        sleep 1
        echo "[rhdh] Starting RHDH..."
        chmod +x "/projects/rhdh-local/scripts/start-rhdh.sh" 2>/dev/null
        /projects/rhdh-local/scripts/start-rhdh.sh
      workingDir: /projects/rhdh-local
      group:
        kind: run
        isDefault: false

  # ── Plugin Development ───────────────────────────────────────────────────
  - id: deploy-plugin
    exec:
      label: "Deploy plugin to RHDH"
      component: tools
      commandLine: |
        set -e
        _PLUGIN="${PLUGIN_NAME:-}"
        if [ -z "$_PLUGIN" ] && [ -t 0 ]; then
          read -r -p "[plugin] Enter plugin directory name: " _PLUGIN
        fi
        [ -z "$_PLUGIN" ] && { echo "[plugin] ERROR: Set PLUGIN_NAME or provide input"; exit 1; }

        _PLUGIN_DIR="/projects/$_PLUGIN"
        [ -d "$_PLUGIN_DIR" ] || { echo "[plugin] ERROR: Directory $_PLUGIN_DIR not found"; exit 1; }

        cd "$_PLUGIN_DIR"
        echo "[plugin] Installing dependencies..."
        yarn install
        echo "[plugin] Exporting dynamic plugin..."
        npx --yes @red-hat-developer-hub/cli@latest plugin export --clean \
          --dynamic-plugins-root /dynamic-plugins-root
        echo ""
        echo "[plugin] ✓ Deployed to /dynamic-plugins-root"
        echo "[plugin] Run 'Restart RHDH' to load the updated plugin."
      workingDir: /projects
      group:
        kind: build
        isDefault: false

  # ── SonataFlow ───────────────────────────────────────────────────────────
  - id: start-sonataflow
    exec:
      label: "Start SonataFlow"
      component: sonataflow
      commandLine: |
        chmod +x "/projects/rhdh-local/scripts/start-orchestrator.sh" 2>/dev/null
        /projects/rhdh-local/scripts/start-orchestrator.sh
      workingDir: /home/kogito/serverless-workflow-project
      group:
        kind: run
        isDefault: false
  - id: restart-sonataflow
    exec:
      label: "Restart SonataFlow"
      component: sonataflow
      commandLine: |
        echo "[sonataflow] Stopping..."
        pkill -f 'java.*quarkus' 2>/dev/null || true
        sleep 3
        pkill -9 -f 'java.*quarkus' 2>/dev/null || true
        sleep 1
        echo "[sonataflow] Starting..."
        chmod +x "/projects/rhdh-local/scripts/start-orchestrator.sh" 2>/dev/null
        /projects/rhdh-local/scripts/start-orchestrator.sh
      workingDir: /home/kogito/serverless-workflow-project
      group:
        kind: run
        isDefault: false

events:
  postStart:
    - start-rhdh
